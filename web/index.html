<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Relay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97757'/%3E%3Ctext x='32' y='43' font-family='Segoe UI,Arial' font-weight='700' font-size='32' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css?v=14.1.0">
<link rel="stylesheet" href="/connectors.css?v=14.1.0">
<link rel="stylesheet" href="/learning.css?v=14.1.0">
<script>
  try {
    // Carry over settings saved under the previous product name.
    for (const k of ["theme", "density", "sidebarW", "sidebarCollapsed"]) {
      const old = localStorage.getItem("devorch." + k);
      if (old !== null && localStorage.getItem("relay." + k) === null) localStorage.setItem("relay." + k, old);
    }
    const t = localStorage.getItem("relay.theme") || "system";
    const r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
    document.documentElement.dataset.theme = r;
    document.documentElement.dataset.density = localStorage.getItem("relay.density") || "comfortable";
  } catch {}
</script>
</head>
<body>
<div id="app" class="app">
  <nav class="rail" aria-label="Primary">
    <a class="rail-brand" href="#/" title="Relay"><span>R</span></a>
    <a class="rail-btn" href="#/" data-nav="dashboard" title="Dashboard (G D)"><i data-icon="home"></i></a>
    <button class="rail-btn" id="sidebarToggle" title="Show or hide the task list (B) · J / K to move through it"><i data-icon="tasks"></i></button>
    <a class="rail-btn" href="#/inbox" data-nav="inbox" title="Needs you (G Y)"><i data-icon="inbox"></i><span class="rail-badge" id="inboxBadge" hidden></span></a>
    <a class="rail-btn" href="#/digest" data-nav="digest" title="Digest (G E)"><i data-icon="sunrise"></i></a>
    <a class="rail-btn" href="#/agents" data-nav="agents" title="Agents (G A)"><i data-icon="bot"></i></a>
    <a class="rail-btn" href="#/issues" data-nav="issues" title="Issues (G I)"><i data-icon="issue"></i></a>
    <a class="rail-btn" href="#/github" data-nav="github" title="GitHub inbox (G H)"><i data-icon="github"></i></a>
    <a class="rail-btn" href="#/repos" data-nav="repos" title="Repositories (G R)"><i data-icon="folder"></i></a>
    <a class="rail-btn" href="#/lessons" data-nav="lessons" title="Lessons (G L)"><i data-icon="brain"></i><span class="rail-badge" id="lessonsBadge" hidden></span></a>
    <a class="rail-btn" href="#/learning" data-nav="learning" title="Learning (G N)"><i data-icon="gauge"></i><span class="rail-badge" id="learningBadge" hidden></span></a>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="paletteBtn" title="Command palette (Ctrl+K)"><i data-icon="command"></i></button>
    <button class="rail-btn" id="shortcutsBtn" title="Keyboard shortcuts (?)"><i data-icon="keyboard"></i></button>
    <button class="rail-btn" id="notifBtn" title="Notifications"><i data-icon="bell"></i><span class="rail-badge" id="notifBadge" hidden></span></button>
    <button class="rail-btn" id="themeBtn" title="Toggle theme"><i data-icon="moon"></i></button>
    <a class="rail-btn" href="#/settings" data-nav="settings" title="Settings (G S)"><i data-icon="settings"></i></a>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-resize" id="sidebarResize" title="Drag to resize · double-click to reset"></div>
    <div class="sidebar-head">
      <div class="sidebar-title"><strong>Tasks</strong><span id="taskCount" class="count">0</span></div>
      <button class="btn primary sm" id="newTaskBtn" title="New task (N)"><i data-icon="plus"></i><span class="lbl">New task</span></button>
    </div>
    <div class="sidebar-search"><i data-icon="search"></i><input id="taskSearch" placeholder="Search tasks…  ( / )" autocomplete="off"></div>
    <div class="chips" id="taskFilters">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="attention">Attention</button>
      <button class="chip" data-f="active">Active</button>
      <button class="chip" data-f="done">Done</button>
      <button class="chip" data-f="failed">Failed</button>
      <button class="chip" data-f="archived">Archived</button>
    </div>
    <div id="taskList" class="task-list" role="list"></div>
    <div class="sidebar-foot">
      <div class="queue-box" id="queueBox">
        <div class="queue-state"><span class="dot" id="queueDot"></span><span id="queueText">Queue idle</span></div>
        <div class="queue-ctl">
          <label title="Parallel tasks">×<input id="parallelInput" type="number" min="1" max="8" value="1"></label>
          <button class="btn sm primary" id="runBtn"><i data-icon="play"></i>Run</button>
          <button class="btn sm" id="stopQueueBtn" hidden><i data-icon="stop"></i>Halt</button>
        </div>
      </div>
      <div class="conn" id="connBox"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
    </div>
  </aside>

  <div class="main-col">
    <div class="ap-bar" id="apBar" role="status" aria-live="polite" hidden></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="notifPanel" class="notif-panel" hidden></div>
<script type="module" src="/js/app.js?v=14.1.0"></script>
</body>
</html>
