<script>
  try {
    // Carry over settings saved under the previous product name.
    for (const k of ["theme", "density"]) {
      const old = localStorage.getItem("devorch." + k);
      if (old !== null && localStorage.getItem("relay." + k) === null) localStorage.setItem("relay." + k, old);
    }
    const t = localStorage.getItem("relay.theme") || "system";
    const r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
    document.documentElement.dataset.theme = r;
    document.documentElement.dataset.density = localStorage.getItem("relay.density") || "comfortable";
    if (/^#\/status\//.test(location.hash)) document.documentElement.classList.add("bare");
    // The navigation is painted in its remembered state, never animated into it: "booting" holds the
    // transition off until the first frame is on screen.
    const collapsed = localStorage.getItem("relay.navCollapsed") === "1";
    const onWork = /^#\/(work|tasks|issues)/.test(location.hash);
    const d = document.documentElement;
    d.classList.add("booting");
    if (innerWidth > 760 && (collapsed || (onWork && innerWidth < 1560) || innerWidth <= 1240)) d.classList.add("nav-rail");
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.remove("booting")));
  } catch {}
</script>
</head>
