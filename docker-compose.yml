# Relay in Docker, using the host's agent logins, settings and repositories.
#
#   cp .env.example .env      # then set RELAY_REPOS and RELAY_DATA (and UID/GID on Linux)
#   docker compose up -d --build
#   docker compose logs -f
#
# Open http://127.0.0.1:8767 on this machine. From another computer use an SSH
# tunnel: ssh -L 8767:127.0.0.1:8767 you@server
#
# Only run ONE Relay against a data folder at a time. A host Relay and a container
# Relay sharing RELAY_DATA would overwrite each other's task list.

services:
  relay:
    build:
      context: .
      args:
        UID: ${RELAY_UID:-1000}
        GID: ${RELAY_GID:-1000}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
        GEMINI_VERSION: ${GEMINI_VERSION:-latest}
    image: relay:local
    container_name: relay
    # Gemini CLI encrypts saved logins with a key derived from the hostname; a random container
    # hostname would invalidate them on every recreate.
    hostname: relay
    restart: unless-stopped
    init: false  # tini is the entrypoint already

    # Loopback only. Relay has no login, so it must never be reachable from the network.
    ports:
      - "127.0.0.1:${RELAY_PORT:-8767}:8767"

    environment:
      # Agents installed from the Agents page, so `docker exec -it relay <agent> login` works too.
      PATH: ${RELAY_DATA}/agents/npm/bin:${RELAY_DATA}/agents/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RELAY_DATA_DIR: ${RELAY_DATA:?set RELAY_DATA in .env}
      RELAY_REPOS: ${RELAY_REPOS:?set RELAY_REPOS in .env}
      RELAY_BROWSE_ROOT: ${RELAY_REPOS}
      # GitHub CLI: on Windows and macOS hosts gh keeps its token in the system
      # keychain, which cannot be mounted. Put a token here instead (gh auth token).
      GH_TOKEN: ${GH_TOKEN:-}
      # Gemini with a Google Workspace account also needs this.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}

    volumes:
      # ---- Relay's own home: logins and settings of agents installed from the Agents
      # page live here, so they survive restarts. The host logins below sit on top of it.
      - ${RELAY_DATA}/home:/home/relay
      # ---- Host agent logins and settings (read-write: CLIs refresh their tokens here)
      - ${HOST_HOME:-~}/.codex:/home/relay/.codex
      - ${HOST_HOME:-~}/.claude:/home/relay/.claude
      - ${HOST_HOME:-~}/.claude.json:/home/relay/.claude.json
      - ${HOST_HOME:-~}/.gemini:/home/relay/.gemini
      - ${HOST_HOME:-~}/.config/gh:/home/relay/.config/gh
      # ---- Git identity and SSH keys for pushing task branches (read-only)
      - ${HOST_HOME:-~}/.gitconfig:/home/relay/.gitconfig:ro
      - ${HOST_HOME:-~}/.ssh:/home/relay/.ssh:ro

      # ---- Repositories and Relay data, mounted at the SAME absolute path as on
      # the host. Git stores each task worktree's location as an absolute path
      # inside your repository; identical paths keep those links valid from both
      # the container and the host.
      - ${RELAY_REPOS}:${RELAY_REPOS}
      - ${RELAY_DATA}:${RELAY_DATA}

      # ---- Package cache shared by every task's environment setup, so the second
      # install of a repository takes seconds. Private registry credentials
      # (~/.npmrc) are mounted in docker-compose.override.yml when you have them:
      #   - ${HOST_HOME}/.npmrc:/home/relay/.npmrc:ro
      - ${RELAY_CACHE:-./.cache}/npm:/home/relay/.npm

      # ---- Optional: logs and docker connectors (Settings -> Connectors) read container logs and
      # state through the Docker socket. Not mounted by default. Mounting it gives Relay the Docker
      # API of this host: ":ro" only stops the socket file being replaced, not API writes, so Relay
      # itself limits every connector to the containers it lists and only restarts when allowed.
      # Agents run inside this container as the same user, so they could open the socket directly
      # and bypass those limits: only mount it on a host where that is acceptable.
      # Relay's user also needs the socket's group:
      #   - /var/run/docker.sock:/var/run/docker.sock:ro
      # and, at the service level:
      # group_add: ["${DOCKER_GID:-999}"]   # getent group docker | cut -d: -f3
      # ---- System packages (Repositories → Environment → System packages, e.g. unixodbc for
      # pyodbc). Relay installs them with apt-get inside this container before a task's setup,
      # which needs the container to run as root (user: "0:0"); as a non-root user Relay records
      # a blocked check telling you to add them to the image instead. Installed packages live in
      # the container and are reinstalled after it is recreated; to make that fast, keep apt's
      # downloads and package lists on the host (the base image deletes downloaded .debs unless
      # /etc/apt/apt.conf.d/docker-clean is removed):
      #   - ${RELAY_CACHE:-./.cache}/apt-archives:/var/cache/apt/archives
      #   - ${RELAY_CACHE:-./.cache}/apt-lists:/var/lib/apt/lists

    # Agents run shells, test suites and dev servers. Give them room.
    shm_size: "1gb"
    stop_grace_period: 30s

  # Browser VS Code (optional): docker compose --profile ide up -d
  # Put it behind your reverse proxy's login and set Settings -> Verification -> Browser VS Code URL.
  ide:
    profiles: ["ide"]
    build: ./docker/code-server
    image: relay-ide:local
    container_name: relay-ide
    restart: unless-stopped
    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    # Same hostname and home as Relay: an agent signed in from this terminal is signed in for Relay,
    # including CLIs that encrypt their saved login with a hostname-derived key.
    hostname: relay
    ports:
      - "127.0.0.1:${RELAY_IDE_PORT:-8768}:8080"
    environment:
      HOME: /home/relay
      # Agents installed from the Agents page, first on PATH in the terminal.
      PATH: ${RELAY_DATA}/agents/npm/bin:${RELAY_DATA}/agents/bin:/home/relay/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Headless logins: print a link and ask for the code instead of redirecting to localhost.
      NO_BROWSER: "true"
    volumes:
      - ${RELAY_DATA}/home:/home/relay
      - ${RELAY_DATA}/agents:${RELAY_DATA}/agents
      - ${HOST_HOME:-~}/.codex:/home/relay/.codex
      - ${HOST_HOME:-~}/.claude:/home/relay/.claude
      - ${HOST_HOME:-~}/.claude.json:/home/relay/.claude.json
      - ${HOST_HOME:-~}/.gemini:/home/relay/.gemini
      - ${HOST_HOME:-~}/.gitconfig:/home/relay/.gitconfig:ro
      - ${RELAY_REPOS}:${RELAY_REPOS}
      - ${RELAY_DATA}/worktrees:${RELAY_DATA}/worktrees
      # Run folders (logs, artifacts, screenshots) for "Open run folder", read-only.
      - ${RELAY_DATA}/runtime:${RELAY_DATA}/runtime:ro
      - ${RELAY_CACHE:-./.cache}/ide:/home/relay/.local/share/code-server
      - ${RELAY_CACHE:-./.cache}/npm:/home/relay/.npm

